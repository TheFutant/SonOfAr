# ── Anonymous usage telemetry ────────────────────────────────────────────────
# Mirrors MonteJiraSim's usage.py schema: single-line `USAGE {json}` records on
# stdout, no identity / IP / inputs. A static SPA can't print() to stdout, so the
# browser beacons /t?evt=<event>[&lbl=<label>] (see src/utils/usage.ts) and nginx
# emits one line per *known* event. The org-wide fly-log-shipper forwards it to
# Logflare with no per-app wiring; unknown events are discarded to /dev/null.
# These are http-context directives — valid here because nginx includes this
# file inside its `http {}` block (Dockerfile: conf.d/default.conf).

# Whitelist event names — guards against log injection via the query string.
map $arg_evt $usage_evt {
    default        "";
    session_start  session_start;
    new_game       new_game;
    ending         ending;
    detour         detour;
    prologue       prologue;
}

# Optional label (e.g. ending id), constrained to safe chars and omitted when
# absent/invalid. The trailing comma keeps JSON keys sorted (app, evt, lbl, ts),
# matching usage.py's sort_keys output.
map $arg_lbl $usage_lbl_kv {
    default               "";
    "~^[a-z0-9_]{1,40}$"  "\"lbl\":\"$arg_lbl\",";
}

# Known event → log (1); unknown event → skip (0). Used as access_log's `if=`.
map $usage_evt $usage_keep {
    default  0;
    "~.+"    1;
}

# escape=none: inputs are already whitelisted above, so emit literal JSON.
log_format usage_fmt escape=none
    'USAGE {"app":"sonofar","evt":"$usage_evt",$usage_lbl_kv"ts":"$time_iso8601"}';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest: nginx mime.types doesn't know .webmanifest by default
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Long-lived caches for hashed asset files
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Service worker must always revalidate so users pick up new versions
    location = /sw.js {
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Workbox runtime is hash-named — safe to cache aggressively
    location ~ ^/workbox-[a-f0-9]+\.js$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: anything that doesn't match a real file should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anonymous usage beacon → one `USAGE {json}` stdout line per known event
    # (see the usage_fmt log_format above). Fire-and-forget; never cached.
    location = /t {
        access_log /dev/stdout usage_fmt if=$usage_keep;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Cheap healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mild hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    # Gzip is fine for HTML/JS/CSS on a private network
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
